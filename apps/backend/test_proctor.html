<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proctor Test</title>
  <style>
    * { margin: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { font-size: 1.2rem; margin-bottom: 12px; color: #888; }
    #container { position: relative; border-radius: 12px; overflow: hidden; border: 4px solid #444; }
    video { width: 640px; height: 480px; transform: scaleX(-1); display: block; }
    #status-badge {
      position: absolute; top: 10px; left: 10px;
      padding: 6px 14px; border-radius: 20px;
      font-weight: 700; font-size: 14px;
      background: rgba(0,0,0,0.6);
    }
    #direction-badge {
      position: absolute; top: 10px; right: 10px;
      padding: 6px 14px; border-radius: 20px;
      font-size: 13px; color: #f87171;
      background: rgba(0,0,0,0.6);
      display: none;
    }
    #debug-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 6px 12px; font-size: 11px;
      background: rgba(0,0,0,0.5);
      display: flex; justify-content: space-between;
    }
    #log { margin-top: 16px; width: 640px; max-height: 200px; overflow-y: auto;
      font-size: 11px; font-family: monospace; color: #888; background: #1a1a1a;
      padding: 8px; border-radius: 8px; }
    .log-cheat { color: #f87171; }
    .log-ok { color: #4ade80; }
    .log-warn { color: #facc15; }
    #conn-dot { position: absolute; bottom: 30px; right: 10px; width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>
  <h1>Proctor WebSocket Test</h1>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div id="status-badge">⏳ Connecting...</div>
    <div id="direction-badge"></div>
    <div id="debug-bar">
      <span id="head-info">Head: —</span>
      <span id="eye-info">Eyes: —</span>
      <span id="face-info">Faces: — | Streak: —</span>
    </div>
    <div id="conn-dot" style="background:#f87171"></div>
  </div>
  <div id="log"></div>

<script>
const WS_URL = 'ws://localhost:8001/ws/proctor';
const FPS = 7;

const video = document.getElementById('video');
const container = document.getElementById('container');
const statusBadge = document.getElementById('status-badge');
const dirBadge = document.getElementById('direction-badge');
const headInfo = document.getElementById('head-info');
const eyeInfo = document.getElementById('eye-info');
const faceInfo = document.getElementById('face-info');
const connDot = document.getElementById('conn-dot');
const logDiv = document.getElementById('log');

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

let ws = null;
let interval = null;

function addLog(msg, cls) {
  const line = document.createElement('div');
  line.className = cls || '';
  line.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
  logDiv.prepend(line);
  if (logDiv.children.length > 100) logDiv.lastChild.remove();
}

function captureFrame() {
  if (video.readyState < 2) return null;
  canvas.width = 320;
  canvas.height = 240;
  ctx.drawImage(video, 0, 0, 320, 240);
  return canvas.toDataURL('image/jpeg', 0.5);
}

function updateUI(data) {
  // Border color
  const cheating = data.cheating || data.status === 'CHEATING';
  const noFace = data.status === 'NO_FACE';
  const multi = data.status === 'MULTIPLE_FACES';

  container.style.borderColor =
    cheating ? '#ef4444' : noFace ? '#eab308' : multi ? '#f97316' : '#22c55e';

  // Status badge
  statusBadge.textContent =
    cheating ? '🚨 CHEATING' : noFace ? '⚠️ NO FACE' : multi ? '⚠️ MULTIPLE FACES' : '✅ OK';

  // Gaze direction badge
  if (data.gaze && data.gaze !== 'Looking Straight') {
    dirBadge.style.display = 'block';
    dirBadge.textContent = data.gaze;
  } else {
    dirBadge.style.display = 'none';
  }

  // Debug bar
  headInfo.textContent = `Angle: ${data.angle}°`;
  eyeInfo.textContent = `Lateral: ${data.lateral}`;
  faceInfo.textContent = `Faces: ${data.face_count} | Streak: ${data.cheat_counter}`;

  // Log important events
  if (cheating) addLog(`CHEATING — ${data.gaze} | angle=${data.angle}° lateral=${data.lateral}`, 'log-cheat');
  else if (noFace) addLog('No face detected', 'log-warn');
  else if (multi) addLog(`Multiple faces: ${data.face_count}`, 'log-warn');
}

async function start() {
  // 1. Open webcam
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }
    });
    video.srcObject = stream;
    addLog('Webcam opened', 'log-ok');
  } catch (e) {
    statusBadge.textContent = '📷 No Camera';
    addLog('Failed to open webcam: ' + e.message, 'log-cheat');
    return;
  }

  // 2. Connect WebSocket
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    connDot.style.background = '#4ade80';
    addLog('WebSocket connected', 'log-ok');

    // 3. Start sending frames
    interval = setInterval(() => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const frame = captureFrame();
      if (frame) ws.send(frame);
    }, 1000 / FPS);
  };

  ws.onmessage = (e) => {
    try { updateUI(JSON.parse(e.data)); } catch {}
  };

  ws.onclose = () => {
    connDot.style.background = '#f87171';
    addLog('WebSocket disconnected', 'log-warn');
    if (interval) clearInterval(interval);
  };

  ws.onerror = () => {
    addLog('WebSocket error — is the backend running?', 'log-cheat');
  };
}

start();
</script>
</body>
</html>
